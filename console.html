<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Telegraph Cloud console — projects, Drive, document database, object storage, and developer access.">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="/console">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Telegraph Cloud</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body class="console-body">
  <a class="skip-link" href="#console-main" data-i18n="cSkipToContent">Skip to content</a>

  <div class="c-app" id="c-app">
    <div class="c-scrim" id="c-scrim" hidden></div>

    <aside class="c-sidebar" id="c-sidebar" aria-label="Primary">
      <div class="c-brand">
        <span class="c-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.8-7.9A5.5 5.5 0 0 1 17 9.5 3.5 3.5 0 0 1 17.5 16.5H7"/><path d="M9.5 13.5l2.5-2.5 2.5 2.5M12 11v5"/></svg>
        </span>
        <a class="c-brand-name" href="#/overview">Telegraph Cloud</a>
      </div>

      <nav class="c-nav" id="c-global-nav" aria-label="Global"></nav>

      <div class="c-nav-group" id="c-project-nav-group" hidden>
        <p class="c-nav-section" id="c-project-nav-title"></p>
        <nav class="c-nav" id="c-project-nav" aria-label="Project"></nav>
      </div>

      <div class="c-sidebar-footer">
        <a class="c-nav-item c-nav-legacy" id="c-legacy-link" href="/admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9h17"/><circle cx="7" cy="7" r=".5" fill="currentColor"/></svg>
          <span data-i18n="cNavLegacy">Legacy Media</span>
        </a>
        <button type="button" class="c-nav-item" id="c-sidebar-signout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5"/><path d="M15 12H4"/></svg>
          <span data-i18n="cSignOut">Sign out</span>
        </button>
      </div>
    </aside>

    <div class="c-main-col">
      <header class="c-topbar">
        <button type="button" class="c-icon-btn" id="c-menu-toggle" aria-expanded="false" aria-controls="c-sidebar" data-i18n-aria="cToggleNav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button type="button" class="c-project-switch" id="c-project-switch" hidden aria-haspopup="menu" data-i18n-aria="cProjectSwitch">
          <span class="c-project-dot" aria-hidden="true"></span>
          <span class="c-project-switch-text" id="c-project-switch-text"></span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="c-topbar-spacer"></div>
        <div class="c-topbar-actions" role="toolbar">
          <button type="button" class="c-icon-btn" id="c-theme-btn" aria-pressed="false" data-i18n-aria="cToggleTheme">
            <svg class="c-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" class="c-icon-btn" id="c-lang-btn" data-i18n-aria="cLanguage">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 3.9 6 3.9 9s-1.3 6-3.9 9c-2.6-3-3.9-6-3.9-9S9.4 6 12 3z"/></svg>
          </button>
          <a class="c-icon-btn" href="/" data-i18n-aria="cReturnHome" data-i18n-title="cReturnHome">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/></svg>
          </a>
        </div>
      </header>

      <main class="c-view" id="console-main" tabindex="-1"></main>
    </div>
  </div>

  <div class="c-overlay" id="c-overlay" hidden></div>
  <div class="c-toast" id="c-toast" role="status" aria-live="polite"></div>
  <div class="c-sr-only" id="c-live" aria-live="polite" aria-atomic="true"></div>

  <input id="c-file-input" type="file" multiple hidden>
  <input id="c-folder-input" type="file" multiple webkitdirectory hidden>

  <script type="module" src="/js/console/main.js"></script>
</body>
</html>
